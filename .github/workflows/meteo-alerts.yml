name: Alertes météo

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les ~15 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # lancement manuel pour tester

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les alertes et notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUMMARY_HOUR: "19"   # heure (Paris) du récap de demain
        run: python scripts/check_alerts.py
